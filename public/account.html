<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人中心 · 蓝云屿</title>
  <link rel="stylesheet" href="assets/css/style.css?v=11" />
  <link rel="icon" type="image/png" href="assets/images/logo.png?v=3" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="brand" href="index.html"><img class="logo" src="assets/images/logo.png" alt="蓝云屿 logo" /> 蓝云屿</a>
      <button class="nav-toggle" id="navToggle">菜单</button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">首页</a>
        <a href="about.html">介绍</a>
        <a href="download.html">下载</a>
        <a href="index.html#community">社区</a>
        <a href="index.html#contact">联系</a>
        <a href="account.html" id="navAccount">登录 / 注册</a>
        <span id="navExtra"></span>
      </div>
    </div>
  </nav>

  <section class="section" style="padding-top:120px;">
    <div class="container">
      <div class="section-head"><h2 id="accTitle">个人中心</h2></div>

      <!-- 未登录：登录 + 注册 -->
      <div class="auth-wrap" id="authWrap">
        <div class="admin-card" style="max-width:420px;margin:0 auto;">
          <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">登录</button>
            <button class="auth-tab" data-tab="register">注册</button>
          </div>

          <form id="loginForm" class="auth-form">
            <div class="admin-field"><label>用户名</label><input type="text" id="loginUser" placeholder="用户名" autocomplete="username" /></div>
            <div class="admin-field"><label>密码</label><input type="password" id="loginPwd" placeholder="密码" autocomplete="current-password" /></div>
            <button type="submit" class="admin-btn primary" style="width:100%;">登录</button>
            <p class="auth-err" id="loginErr"></p>
          </form>

          <form id="regForm" class="auth-form" style="display:none;">
            <div class="admin-field"><label>用户名（3-20 位）</label><input type="text" id="regUser" placeholder="字母/数字/中文/下划线" autocomplete="username" /></div>
            <div class="admin-field"><label>密码（至少 6 位）</label><input type="password" id="regPwd" placeholder="密码" autocomplete="new-password" /></div>
            <div class="admin-field"><label>QQ 号（选填）</label><input type="text" id="regQq" placeholder="绑定 QQ 后可一键登录" /></div>
            <button type="submit" class="admin-btn primary" style="width:100%;">注册</button>
            <p class="auth-err" id="regErr"></p>
          </form>
        </div>
      </div>

      <!-- 已登录：信息 + 改密码 + 登出 -->
      <div class="admin-card" id="profileWrap" style="max-width:520px;margin:0 auto;display:none;">
        <h3 style="color:#fff;">👋 <span id="profName"></span></h3>
        <p class="hint" id="profQq" style="color:#94a3b8;"></p>
        <hr style="border-color:rgba(255,255,255,.1);margin:18px 0;" />
        <h4 style="color:#fff;margin:0 0 12px;">修改密码</h4>
        <form id="pwdForm">
          <div class="admin-field"><label>原密码</label><input type="password" id="oldPwd" autocomplete="current-password" /></div>
          <div class="admin-field"><label>新密码（至少 6 位）</label><input type="password" id="newPwd" autocomplete="new-password" /></div>
          <button type="submit" class="admin-btn primary">保存新密码</button>
          <button type="button" class="admin-btn secondary" id="logoutBtn" style="margin-left:8px;">退出登录</button>
          <p class="auth-err" id="pwdMsg"></p>
        </form>
      </div>
    </div>
  </section>

  <script src="assets/js/nav-user.js?v=1"></script>
  <script src="assets/js/account.js?v=1"></script>
</body>
</html>
