<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b1020; color:#cbd5e1;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { text-align:center; padding:24px; }
  .code { font-size:5rem; font-weight:800; color:#334e68; letter-spacing:.08em; margin:0; }
  h1 { font-size:1.2rem; color:#e2e8f0; margin:.2em 0 .6em; }
  p { color:#8aa0b8; margin:0 0 22px; }
  a { color:#5eb3ff; text-decoration:none; border:1px solid #2b4a6b; padding:9px 18px; border-radius:9px; }
  a:hover { background:#13243a; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>页面不存在</h1>
    <p>你访问的页面不存在或已被移动。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
